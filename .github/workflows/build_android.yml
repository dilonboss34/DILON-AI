name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git libffi-dev libssl-dev zlib1g-dev libgdk-pixbuf2.0-dev libpango1.0-dev libsmpeg-dev libswscale-dev libavformat-dev libavcodec-dev libportmidi-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev openjdk-17-jdk unzip zip autoconf libtool pkg-config

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.37

    - name: Build APK
      working-directory: mobile
      run: buildozer android debug
      env:
        ANDROID_HOME: /opt/android-sdk
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Mobile-APK
        path: mobile/bin/*.apk
